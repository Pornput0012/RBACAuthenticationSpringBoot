spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:template_rbac_database}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      initialization-fail-timeout: 60000
      connection-timeout: 30000
  flyway:
    connect-retries: 5
    connect-retries-interval: 2

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
  allow-credentials: true
  max-age: 3600

jwt:
  secret: ${JWT_SECRET}
  secret-refresh: ${JWT_SECRET_REFRESH}
  expiration: ${JWT_EXPIRATION:3600}
  expiration-refresh: ${JWT_EXPIRATION_REFRESH:604800}
  issuer: ${JWT_ISSUER:rbac-template}

server:
  error:
    include-stacktrace: never

logging:
  level:
    org.springframework.security: WARN
    com.pornput.rbactemplate: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
