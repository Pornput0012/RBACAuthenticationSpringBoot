spring.application.name=RBAC-template

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3300/template_rbac_database
spring.datasource.username=root
spring.datasource.password=rootPassword

spring.jpa.hibernate.ddl-auto=none

cors.allowed-origins[0]=http://localhost:5173
cors.allowed-origins[1]=http://localhost:3000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allow-credentials=true
cors.max-age=3600

jwt.secret=super-secret-key-super-secret-key
jwt.expiration=3600
jwt.issuer=unknown

server.error.include-stacktrace=on_param

logging.level.org.springframework.security=DEBUG